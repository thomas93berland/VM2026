<div class="wrap">
  <div class="top"><div class="brand"><div class="logo">♞</div><div><strong>CHESS LOUNGE</strong><span>Online sjakkrom</span></div></div><a class="badge" href="index.html">Til lounge</a></div>

<script>

Value.serverTimestamp()});joinWatch(id);toast('Rom opprettet: '+id)}async function joinRoom(){const id=$('joinCode').value.trim().toUpperCase();if(!id)return toast('Skriv romkode');const r=db.collection('chessGames').doc(id),s=await r.get();if(!s.exists)return toast('Fant ikke rom');const g=s.data();if(g.players?.w?.uid===user.uid||g.players?.b?.uid===user.uid){joinWatch(id);return}if(!g.players?.b){await r.update({'players.b':player(),status:'active',updatedAt:firebase.firestore.FieldValue.serverTimestamp()});joinWatch(id);return}joinWatch(id);toast('Rommet er fullt. Du ser på som tilskuer.')}function joinWatch(id){if(unsub)unsub();ref=db.collection('chessGames').doc(id);history.replaceState(null,'','?room='+id);unsub=ref.onSnapshot(s=>{if(!s.exists){toast('Rommet finnes ikke');return}game=s.data();myColor=game.players?.w?.uid===user.uid?'w':game.players?.b?.uid===user.uid?'b':'s';sel=null;legal=[];render()},e=>toast('Firestore: '+e.code));show('lobby',false);show('gameBox',true)}function render(){if(!game)return;$('roomCode').textContent=game.code||ref.id;$('statusText').textContent=statusName(game.status);$('whiteName').textContent=game.players?.w?.name||'Venter...';$('blackName').textContent=game.players?.b?.name||'Venter...';$('mySide').textContent=sideName(myColor);renderBoard();renderMoves()}function renderMoves(){const m=game.moves||[];$('moves').innerHTML=m.length?m.map((x,i)=>`<div class="move"><small>${i+1}. ${x.by==='w'?'Hvit':'Svart'}</small><b>${x.n}</b></div>`).join(''):'<div class="move"><small>Ingen trekk ennå.</small></div>'}function renderBoard(){const b=$('board'),brd=game.board,rows=[0,1,2,3,4,5,6,7],cols=[0,1,2,3,4,5,6,7];if(myColor==='b'){rows.reverse();cols.reverse()}const kp=isCheck(brd,game.turn,ctx(game))?king(brd,game.turn):null;b.innerHTML='';for(const r of rows)for(const c of cols){const p=brd[r][c],bt=document.createElement('button');bt.className='sq '+((r+c)%2?'dark':'light');bt.dataset.r=r;bt.dataset.c=c;if((r===0||r===7)&&p)bt.dataset.home='1';if(pt(p)==='P')bt.dataset.pawn='1';if(sel&&sel.r===r&&sel.c===c)bt.classList.add('sel');if(game.lastMove&&((game.lastMove.f.r===r&&game.lastMove.f.c===c)||(game.lastMove.t.r===r&&game.lastMove.t.c===c)))bt.classList.add('last');if(kp&&kp.r===r&&kp.c===c)bt.classList.add('check');const lm=legal.find(m=>m.to.r===r&&m.to.c===c);if(lm)bt.classList.add(brd[r][c]||lm.enPassant?'cap':'legal');if(p)bt.innerHTML=`<img class="piece" src="${PIECE_PATH}${p}.svg" alt="">`;bt.onclick=clickSq;b.appendChild(bt)}}function canMove(){return game&&(game.status==='active'||game.status==='check')&&myColor===game.turn}function clickSq(e){if(pending||!canMove())return;const r=+e.currentTarget.dataset.r,c=+e.currentTarget.dataset.c,p=game.board[r][c];if(sel){if(sel.r===r&&sel.c===c){sel=null;legal=[];return render()}const m=legal.find(x=>x.to.r===r&&x.to.c===c);if(m)return tryMove(m);if(p&&pc(p)===myColor){sel={r,c};legal=legalFor(game.board,r,c,myColor,ctx(game));return render()}sel=null;legal=[];return render()}if(p&&pc(p)===myColor){sel={r,c};legal=legalFor(game.board,r,c,myColor,ctx(game));render()}}function tryMove(m,promo){const p=game.board[m.from.r][m.from.c];if(m.promotion&&!promo){pending=m;return showPromo(pc(p))}commitMove(m,promo||'Q')}async function commitMove(m,promo){if(!canMove())return;const b=clone(game.board),c=ctx(game),p=b[m.from.r][m.from.c],cap=m.enPassant?b[m.from.r][m.to.c]:b[m.to.r][m.to.c];apply(b,m,promo);const nc=rights(c,p,m),ep=pt(p)==='P'&&Math.abs(m.to.r-m.from.r)===2?{r:(m.from.r+m.to.r)/2,c:m.from.c}:null,next=opp(game.turn),nctx={castle:nc,enPassant:ep},lm=allLegal(b,next,nctx),chk=isCheck(b,next,nctx);let st=chk?'check':'active',winner=null;if(!lm.length){st=chk?'checkmate':'stalemate';winner=chk?game.turn:null}let captured=clone(game.captured||{w:[],b:[]});if(cap)captured[game.turn].push(cap);const moveObj={by:game.turn,n:note(m,p,cap,promo)+(st==='check'?' +':st==='checkmate'?' #':''),at:Date.now()};await ref.update({board:b,turn:next,castle:nc,enPassant:ep,status:st,winner,captured,lastMove:{f:m.from,t:m.to},moves:[...(game.moves||[]),moveObj],updatedAt:firebase.firestore.FieldValue.serverTimestamp()})}function showPromo(side){const box=$('promoButtons');box.innerHTML='';['Q','R','B','N'].forEach(t=>{const b=document.createElement('button');b.innerHTML=`<img src="${PIECE_PATH}${side+t}.svg" alt="">`;b.onclick=()=>{const m=pending;pending=null;$('promo').classList.remove('open');tryMove(m,t)};box.appendChild(b)});$('promo').classList.add('open')}function note(m,p,cap,promo){let n=pt(p)==='P'?'':pt(p);if(cap)n+='x';n+=sq(m.to.r,m.to.c);if(m.promotion)n+='='+(promo||'Q');return n}function ctx(g){return{castle:g.castle||{wK:true,wQ:true,bK:true,bQ:true},enPassant:g.enPassant||null}}function pseudo(b,r,c,ct,check=false){const p=b[r][c];if(!p)return[];const k=pc(p),t=pt(p),out=[],add=(rr,cc,x={})=>{if(inb(rr,cc))out.push({from:{r,c},to:{r:rr,c:cc},...x})};if(t==='P'){const d=k==='w'?-1:1,st=k==='w'?6:1,pr=k==='w'?0:7;if(!check&&inb(r+d,c)&&!b[r+d][c]){add(r+d,c,{promotion:r+d===pr});if(r===st&&!b[r+2*d][c])add(r+2*d,c)}for(const dc of[-1,1]){const rr=r+d,cc=c+dc;if(!inb(rr,cc))continue;if(check)add(rr,cc);else if(b[rr][cc]&&pc(b[rr][cc])!==k)add(rr,cc,{promotion:rr===pr});else if(ct.enPassant&&ct.enPassant.r===rr&&ct.enPassant.c===cc)add(rr,cc,{enPassant:true})}}if(t==='N')[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]].forEach(([dr,dc])=>{const rr=r+dr,cc=c+dc;if(inb(rr,cc)&&(!b[rr][cc]||pc(b[rr][cc])!==k))add(rr,cc)});if('BRQ'.includes(t)){let dirs=[];if('BQ'.includes(t))dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);if('RQ'.includes(t))dirs.push([-1,0],[1,0],[0,-1],[0,1]);for(const[dr,dc]of dirs){let rr=r+dr,cc=c+dc;while(inb(rr,cc)){if(!b[rr][cc])add(rr,cc);else{if(pc(b[rr][cc])!==k)add(rr,cc);break}rr+=dr;cc+=dc}}}if(t==='K'){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(dr||dc){const rr=r+dr,cc=c+dc;if(inb(rr,cc)&&(!b[rr][cc]||pc(b[rr][cc])!==k))add(rr,cc)}if(!check&&!isCheck(b,k,ct)){const home=k==='w'?7:0;if(r===home&&c===4){if(ct.castle[k+'K']&&!b[home][5]&&!b[home][6]&&!attacked(b,home,5,opp(k),ct)&&!attacked(b,home,6,opp(k),ct))add(home,6,{castle:true});if(ct.castle[k+'Q']&&!b[home][1]&&!b[home][2]&&!b[home][3]&&!attacked(b,home,3,opp(k),ct)&&!attacked(b,home,2,opp(k),ct))add(home,2,{castle:true})}}}return out}function legalFor(b,r,c,side,ct){const p=b[r][c];if(!p||pc(p)!==side)return[];return pseudo(b,r,c,ct).filter(m=>{const bb=clone(b);apply(bb,m,'Q');return !isCheck(bb,side,ct)})}function allLegal(b,side,ct){let o=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(b[r][c]&&pc(b[r][c])===side)o.push(...legalFor(b,r,c,side,ct));return o}function king(b,side){for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(b[r][c]===side+'K')return{r,c};return null}function isCheck(b,side,ct){const k=king(b,side);return k?attacked(b,k.r,k.c,opp(side),ct):false}function attacked(b,r,c,by,ct){for(let rr=0;rr<8;rr++)for(let cc=0;cc<8;cc++)if(b[rr][cc]&&pc(b[rr][cc])===by&&pseudo(b,rr,cc,ct,true).some(m=>m.to.r===r&&m.to.c===c))return true;return false}function apply(b,m,promo){const p=b[m.from.r][m.from.c];b[m.from.r][m.from.c]=null;if(m.enPassant)b[m.from.r][m.to.c]=null;if(m.castle){if(m.to.c===6){b[m.from.r][5]=b[m.from.r][7];b[m.from.r][7]=null}else{b[m.from.r][3]=b[m.from.r][0];b[m.from.r][0]=null}}b[m.to.r][m.to.c]=m.promotion?pc(p)+(promo||'Q'):p}function rights(ct,p,m){const ca=clone(ct.castle),k=pc(p),t=pt(p);if(t==='K'){ca[k+'K']=false;ca[k+'Q']=false}if(t==='R'){if(m.from.r===7&&m.from.c===0)ca.wQ=false;if(m.from.r===7&&m.from.c===7)ca.wK=false;if(m.from.r===0&&m.from.c===0)ca.bQ=false;if(m.from.r===0&&m.from.c===7)ca.bK=false}if(m.to.r===7&&m.to.c===0)ca.wQ=false;if(m.to.r===7&&m.to.c===7)ca.wK=false;if(m.to.r===0&&m.to.c===0)ca.bQ=false;if(m.to.r===0&&m.to.c===7)ca.bK=false;return ca}async function resetGame(){if(!ref||myColor==='s')return;await ref.update({board:START,turn:'w',castle:{wK:true,wQ:true,bK:true,bQ:true},enPassant:null,status:game.players?.b?'active':'waiting',winner:null,moves:[],captured:{w:[],b:[]},lastMove:null,updatedAt:firebase.firestore.FieldValue.serverTimestamp()})}async function resign(){if(!ref||myColor==='s'||game.status==='checkmate'||game.status==='stalemate')return;await ref.update({status:'resigned',winner:opp(myColor),updatedAt:firebase.firestore.FieldValue.serverTimestamp()})}function leave(){if(unsub)unsub();unsub=null;ref=null;game=null;history.replaceState(null,'','play.html');show('gameBox',false);show('lobby',!!user)}$('createBtn').onclick=createRoom;$('joinBtn').onclick=joinRoom;$('copyBtn').onclick=()=>navigator.clipboard?.writeText($('roomCode').textContent).then(()=>toast('Kode kopiert'));$('resetBtn').onclick=resetGame;$('resignBtn').onclick=resign;$('leaveBtn').onclick=leave;if(!window.firebase||!window.VM_FIREBASE_CONFIG){toast('Firebase mangler')}else{if(!firebase.apps.length)firebase.initializeApp(window.VM_FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();auth.onAuthStateChanged(async u=>{user=u;if(!u){show('authBox',true);show('lobby',false);show('gameBox',false);return}show('authBox',false);await loadProfile();show('lobby',true);const params=new URLSearchParams(location.search);const room=params.get('room');if(room){$('joinCode').value=room.toUpperCase();joinRoom()}})}
