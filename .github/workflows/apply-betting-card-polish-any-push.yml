name: Apply betting card polish on push

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable premium betting cards in index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '  <link rel="stylesheet" href="css/betting-polish.css?v=8" />'
          js = '  <script src="js/vm-match-cards.js?v=8"></script>'
          if 'css/betting-polish.css' not in s:
              s = s.replace('</head>', css + '\n</head>')
          if 'js/vm-match-cards.js' not in s:
              marker = '  <script src="js/core/rank-titles.js?v=3"></script>'
              s = s.replace(marker, marker + '\n' + js)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Enable premium betting match cards"
          git push
