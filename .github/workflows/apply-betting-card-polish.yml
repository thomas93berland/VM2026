name: Apply betting card polish

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-betting-card-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add betting card polish files to index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '  <link rel="stylesheet" href="css/betting-polish.css?v=7" />'
          js = '  <script src="js/vm-match-cards.js?v=7"></script>'
          if 'css/betting-polish.css' not in s:
              s = s.replace('</head>', css + '\n</head>')
          if 'js/vm-match-cards.js' not in s:
              s = s.replace('  <script src="js/core/rank-titles.js?v=3"></script>', '  <script src="js/core/rank-titles.js?v=3"></script>\n' + js)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Enable polished betting match cards"
          git push
